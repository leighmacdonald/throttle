; Throttle PHP tweaks for docker.
display_errors = Off
log_errors = On
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 65M
max_execution_time = 120
; APCu: throttle mixes apcu_fetch() and apc_store(), enable both APIs.
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
