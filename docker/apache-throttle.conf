<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/var/www/throttle/web"

    <Directory "/var/www/throttle/web">
        Options -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/throttle_error.log
    CustomLog ${APACHE_LOG_DIR}/throttle_access.log combined
</VirtualHost>
