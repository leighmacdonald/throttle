name: throttle

services:
  db:
    image: mysql:5.7
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-throttle}
      MYSQL_USER: ${DB_USER:-throttle}
      MYSQL_PASSWORD: ${DB_PASSWORD:-throttle}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-rootsecret}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist snapshots/AOF so throttle:stats counters survive restarts.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-throttle}
      DB_USER: ${DB_USER:-throttle}
      DB_PASSWORD: ${DB_PASSWORD:-throttle}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      THROTTLE_HOSTNAME: ${THROTTLE_HOSTNAME:-localhost}
      THROTTLE_DEBUG: ${THROTTLE_DEBUG:-false}
      THROTTLE_FORCE_CONFIG: ${THROTTLE_FORCE_CONFIG:-1}
      # Where Stats.php finds the munin-compatible RRDs (see `graphs`).
      MUNIN_RRDDIR: /var/lib/munin
      MUNIN_HOST: ${MUNIN_HOST:-throttle}
    volumes:
      # Persist uploads/symbols/logs outside the container image.
      - dumps_data:/var/www/throttle/dumps
      - symbols_data:/var/www/throttle/symbols
      - logs_data:/var/www/throttle/logs
      - cache_data:/var/www/throttle/cache
      # RRD graph data, written by the `graphs` service (read-only here).
      - munin_data:/var/lib/munin:ro

  # Feeds throttle's munin-plugin counters into RRD files every
  # GRAPH_INTERVAL seconds (munin default 300), readable by the app's
  # /stats/* endpoints. Same image as `app`, different command.
  graphs:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-throttle}
      DB_USER: ${DB_USER:-throttle}
      DB_PASSWORD: ${DB_PASSWORD:-throttle}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MUNIN_RRDDIR: /var/lib/munin
      MUNIN_HOST: ${MUNIN_HOST:-throttle}
      GRAPH_INTERVAL: ${GRAPH_INTERVAL:-300}
    command: ["throttle-graphs.sh"]
    volumes:
      - munin_data:/var/lib/munin

  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      THROTTLE_HOSTNAME: ${THROTTLE_HOSTNAME:-localhost}
      # Cloudflare API token with "Zone:DNS:Edit" permissions for the domain.
      # When set, Caddy uses the DNS challenge to provision TLS via Let's Encrypt.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      # HTTP (port 80) for ACME HTTP-01 challenge redirects and non-HTTPS traffic
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      # HTTPS (port 443) when CF_API_TOKEN is set
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  dumps_data:
  symbols_data:
  logs_data:
  cache_data:
  munin_data:
  caddy_data:
  caddy_config:
